[package]
name = "test-hook"
version = "0.1.0"
description = "Stub Token-2022 transfer hook used by the test suite"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "test_hook"

[features]
default = []
no-entrypoint = []

[dependencies]
solana-account-info = "3"
solana-cpi = "3"
solana-program-entrypoint = "3"
solana-program-error = "3"
solana-pubkey = "3"
solana-rent = "3"
solana-sysvar = "3"
solana-system-interface = { version = "2", features = ["bincode"] }
spl-transfer-hook-interface = "2.1"
spl-tlv-account-resolution = "0.11"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
